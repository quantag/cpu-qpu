<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" role="img"><title>One __qcpu__ call at run time</title><desc>main() on the CPU calls score(); the generated wrapper loads the arguments, the C engine runs the quantum-CPU circuit, the same function runs natively, and the results are compared: equal returns the value (QCPU_OK), different stops the program with QCPU_MISMATCH.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#FFFFFF;stroke:#D3D1C7}
.t{font-size:14px;font-weight:600}.s{font-size:12px}.l{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.ah{fill:none;stroke:#888780;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .t{fill:#2C2C2A}.gray .s{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#26215C}.purple .s{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#04342C}.teal .s{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .t{fill:#4A1B0C}.coral .s{fill:#993C1D}
.head{font-size:13px;font-weight:600;fill:#444441}
@media (prefers-color-scheme: dark){
.bg{fill:#1F1F1E;stroke:#444441}.l,.head{fill:#B4B2A9}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t{fill:#F1EFE8}.gray .s{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .s{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .s{fill:#9FE1CB}
.coral rect{fill:#712B13;stroke:#F0997B}.coral .t{fill:#FAECE7}.coral .s{fill:#F5C4B3}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker></defs><rect class="bg" x="1" y="1" width="678" height="570" rx="12" stroke-width="1"/><text class="head" x="30" y="30">Run time: one call to score() (no Python)</text><g class="gray"><rect x="200" y="46" width="280" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="65" text-anchor="middle" dominant-baseline="central">main() on the CPU</text><text class="s" x="340.0" y="85" text-anchor="middle" dominant-baseline="central">fgets, printf, rand</text></g><line class="arr" x1="340" y1="102" x2="340" y2="128" marker-end="url(#a)"/><g class="purple"><rect x="200" y="132" width="280" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="151" text-anchor="middle" dominant-baseline="central">Generated wrapper score()</text><text class="s" x="340.0" y="171" text-anchor="middle" dominant-baseline="central">arguments into qubit registers</text></g><line class="arr" x1="340" y1="188" x2="340" y2="214" marker-end="url(#a)"/><g class="purple"><rect x="200" y="218" width="280" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="237" text-anchor="middle" dominant-baseline="central">C engine runs the circuit</text><text class="s" x="340.0" y="257" text-anchor="middle" dominant-baseline="central">qcpu: 35M gates; qoracle: 1844</text></g><line class="arr" x1="340" y1="274" x2="340" y2="300" marker-end="url(#a)"/><g class="gray"><rect x="200" y="304" width="280" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="323" text-anchor="middle" dominant-baseline="central">qpu__native_score()</text><text class="s" x="340.0" y="343" text-anchor="middle" dominant-baseline="central">same function on the CPU (E1)</text></g><line class="arr" x1="340" y1="360" x2="340" y2="386" marker-end="url(#a)"/><g class="gray"><rect x="240" y="390" width="200" height="44" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="412" text-anchor="middle" dominant-baseline="central">Compare results</text></g><path class="arr" d="M340 434 L340 456 L190 456 L190 482" marker-end="url(#a)"/><path class="arr" d="M340 456 L490 456 L490 482" marker-end="url(#a)"/><g class="teal"><rect x="80" y="486" width="220" height="56" rx="8" stroke-width="0.8"/><text class="t" x="190.0" y="505" text-anchor="middle" dominant-baseline="central">Equal: QCPU_OK</text><text class="s" x="190.0" y="525" text-anchor="middle" dominant-baseline="central">value back to main()</text></g><g class="coral"><rect x="380" y="486" width="220" height="56" rx="8" stroke-width="0.8"/><text class="t" x="490.0" y="505" text-anchor="middle" dominant-baseline="central">Differ: QCPU_MISMATCH</text><text class="s" x="490.0" y="525" text-anchor="middle" dominant-baseline="central">stop, exit 70 (default)</text></g></svg>
