<svg xmlns="http://www.w3.org/2000/svg" width="680" height="714" viewBox="0 0 680 714" role="img"><title>qcpucc build workflow</title><desc>game.c goes into qcpucc.py, which builds a quantum-CPU side (clang for AArch64, loader and pruning, circuit generator) and a host side (renamed bodies, your C compiler); both are linked with the C engine into game.exe, which contains no Python.</desc><style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#FFFFFF;stroke:#D3D1C7}
.t{font-size:14px;font-weight:600}.s{font-size:12px}.l{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.2;fill:none}.ah{fill:none;stroke:#888780;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .t{fill:#2C2C2A}.gray .s{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#26215C}.purple .s{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#04342C}.teal .s{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .t{fill:#4A1B0C}.coral .s{fill:#993C1D}
.head{font-size:13px;font-weight:600;fill:#444441}
@media (prefers-color-scheme: dark){
.bg{fill:#1F1F1E;stroke:#444441}.l,.head{fill:#B4B2A9}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t{fill:#F1EFE8}.gray .s{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .s{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .s{fill:#9FE1CB}
.coral rect{fill:#712B13;stroke:#F0997B}.coral .t{fill:#FAECE7}.coral .s{fill:#F5C4B3}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker></defs><rect class="bg" x="1" y="1" width="678" height="712" rx="12" stroke-width="1"/><text class="head" x="30" y="30">Build time: qcpucc (Python runs only here)</text><g class="gray"><rect x="230" y="46" width="220" height="44" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="68" text-anchor="middle" dominant-baseline="central">game.c with __qcpu__</text></g><line class="arr" x1="340" y1="90" x2="340" y2="120" marker-end="url(#a)"/><g class="purple"><rect x="210" y="124" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="143" text-anchor="middle" dominant-baseline="central">qcpucc.py</text><text class="s" x="340.0" y="163" text-anchor="middle" dominant-baseline="central">splits the program in two</text></g><path class="arr" d="M340 180 L340 200 L190 200 L190 218" marker-end="url(#a)"/><path class="arr" d="M340 200 L490 200 L490 218" marker-end="url(#a)"/><text class="l" x="190" y="240" text-anchor="middle">quantum-CPU side</text><text class="l" x="490" y="240" text-anchor="middle">host side</text><g class="gray"><rect x="60" y="252" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="190.0" y="271" text-anchor="middle" dominant-baseline="central">clang for AArch64</text><text class="s" x="190.0" y="291" text-anchor="middle" dominant-baseline="central">quantum-CPU machine code</text></g><line class="arr" x1="190" y1="308" x2="190" y2="328" marker-end="url(#a)"/><g class="purple"><rect x="60" y="332" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="190.0" y="351" text-anchor="middle" dominant-baseline="central">Loader and pruning</text><text class="s" x="190.0" y="371" text-anchor="middle" dominant-baseline="central">keeps score() + callees</text></g><line class="arr" x1="190" y1="388" x2="190" y2="408" marker-end="url(#a)"/><g class="purple"><rect x="60" y="412" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="190.0" y="431" text-anchor="middle" dominant-baseline="central">Circuit generator</text><text class="s" x="190.0" y="451" text-anchor="middle" dominant-baseline="central">gates as C data + wrappers</text></g><g class="purple"><rect x="360" y="252" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="490.0" y="271" text-anchor="middle" dominant-baseline="central">Rename marked bodies</text><text class="s" x="490.0" y="291" text-anchor="middle" dominant-baseline="central">score to qpu__native_score</text></g><line class="arr" x1="490" y1="308" x2="490" y2="328" marker-end="url(#a)"/><g class="gray"><rect x="360" y="332" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="490.0" y="351" text-anchor="middle" dominant-baseline="central">Your C compiler</text><text class="s" x="490.0" y="371" text-anchor="middle" dominant-baseline="central">clang or gcc, for the PC</text></g><path class="arr" d="M190 468 L190 490 L340 490 L340 508" marker-end="url(#a)"/><path class="arr" d="M490 388 L490 490 L340 490"/><g class="gray"><rect x="210" y="512" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="531" text-anchor="middle" dominant-baseline="central">Link</text><text class="s" x="340.0" y="551" text-anchor="middle" dominant-baseline="central">plus C engine qpu_engine.c</text></g><line class="arr" x1="340" y1="568" x2="340" y2="596" marker-end="url(#a)"/><g class="teal"><rect x="210" y="600" width="260" height="56" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="619" text-anchor="middle" dominant-baseline="central">game.exe</text><text class="s" x="340.0" y="639" text-anchor="middle" dominant-baseline="central">contains no Python</text></g><g class="purple"><rect x="150" y="678" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="l" x="172" y="689">our Python (build only)</text><g class="gray"><rect x="360" y="678" width="14" height="14" rx="3" stroke-width="0.8"/></g><text class="l" x="382" y="689">ordinary compiler tools</text></svg>
