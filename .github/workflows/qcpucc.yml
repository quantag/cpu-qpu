# __qcpu__ programs (qcpucc) on Linux x86-64, Linux ARM64, macOS on Apple Silicon and Windows.
name: qcpucc
on:
  push:
    branches: [main, qarm-molecules]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang llvm cmake libcurl4-openssl-dev
          if [ "$(uname -m)" = x86_64 ]; then sudo apt-get install -y -q gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user; fi
      - name: Python packages
        run: python -m pip install unicorn lief capstone numpy "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: Tool versions
        shell: bash
        run: |
          uname -a || true
          clang --version | head -2
          cc --version 2>/dev/null | head -1 || true
          cmake --version | head -1
      - name: test_qcpucc
        run: python -m tests.test_qcpucc
      - name: test_qcpu_export (OpenQASM part; Qiskit and CUDA-Q in the job below)
        run: python -m tests.test_qcpu_export
      - name: test_qcpu_search
        run: python -m tests.test_qcpu_search
      - name: test_qarm_exec (Q-ARM v2)
        run: python -m tests.test_qarm_exec
      - name: test_qarm_vqe (Q-ARM v2 VQE; Qiskit parts in the job below)
        run: python -m tests.test_qarm_vqe
      - name: test_libqarm (the native runtime; its ibm backend against a mock of IBM's API in the job below)
        run: python -m tests.test_libqarm
      - name: test_qarm_molecule (QGRAD, L-BFGS, LiH; the generator and Aer in the job below)
        run: python -m tests.test_qarm_molecule
      - name: libqarm with CMake
        shell: bash
        run: |
          cmake -S runtime/libqarm -B build/libqarm
          cmake --build build/libqarm --config Release
  export:
    # the exported circuits in Qiskit and in CUDA-Q itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross libcurl4-openssl-dev ninja-build libglib2.0-dev cmake
      - name: Python packages
        run: python -m pip install unicorn lief capstone numpy qiskit qiskit-qasm3-import qiskit-aer qiskit-ibm-runtime cudaq pyscf "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: test_qcpu_export
        run: python -m tests.test_qcpu_export
      - name: test_qcpu_run
        run: python -m tests.test_qcpu_run
      - name: test_qarm_exec on QPU backends
        run: python -m tests.test_qarm_exec
      - name: test_qarm_vqe on QPU backends
        run: python -m tests.test_qarm_vqe
      - name: test_libqarm with the mock of IBM's REST API
        run: python -m tests.test_libqarm
      - name: test_qarm_molecule with PySCF and Aer
        run: python -m tests.test_qarm_molecule
      - name: QEMU 10.2.4 with plugins (cached)
        id: qemu
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-v10.2.4-aarch64-linux-user-plugins-${{ runner.os }}-1
      - name: Build QEMU
        if: steps.qemu.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch v10.2.4 https://github.com/qemu/qemu.git /tmp/qemu-src
          mkdir /tmp/qemu-src/build && cd /tmp/qemu-src/build
          ../configure --prefix=$HOME/qemu --target-list=aarch64-linux-user --enable-plugins --disable-docs --disable-tools --disable-werror
          ninja install
      - name: test_qarm_qemu (Q-ARM in qemu-aarch64, the plugin of runtime/qemu)
        run: QARM_QEMU=$HOME/qemu/bin/qemu-aarch64 python -m tests.test_qarm_qemu
