# __qcpu__ programs (qcpucc) on Linux x86-64, Linux ARM64, macOS on Apple Silicon and Windows.
name: qcpucc
on:
  push:
    branches: [main, qcpu-search]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm cmake
      - name: Python packages
        run: python -m pip install unicorn lief capstone "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: Tool versions
        shell: bash
        run: |
          uname -a || true
          clang --version | head -2
          cc --version 2>/dev/null | head -1 || true
          cmake --version | head -1
      - name: test_qcpucc
        run: python -m tests.test_qcpucc
      - name: test_qcpu_export (OpenQASM part; Qiskit and CUDA-Q in the job below)
        run: python -m tests.test_qcpu_export
      - name: test_qcpu_search
        run: python -m tests.test_qcpu_search
  export:
    # the exported circuits in Qiskit and in CUDA-Q itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm
      - name: Python packages
        run: python -m pip install unicorn lief capstone qiskit qiskit-qasm3-import cudaq "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: test_qcpu_export
        run: python -m tests.test_qcpu_export
