# __qcpu__ programs (qcpucc) on Linux x86-64, Linux ARM64, macOS on Apple Silicon and Windows.
name: qcpucc
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang llvm cmake libcurl4-openssl-dev
          if [ "$(uname -m)" = x86_64 ]; then sudo apt-get install -y -q gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user; fi
      - name: Python packages
        run: python -m pip install unicorn lief capstone numpy "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: Tool versions
        shell: bash
        run: |
          uname -a || true
          clang --version | head -2
          cc --version 2>/dev/null | head -1 || true
          cmake --version | head -1
      - name: test_qcpucc
        run: python -m tests.test_qcpucc
      - name: test_qcpu_export (OpenQASM part; Qiskit and CUDA-Q in the job below)
        run: python -m tests.test_qcpu_export
      - name: test_qcpu_search
        run: python -m tests.test_qcpu_search
      - name: test_qarm_exec (Q-ARM v2)
        run: python -m tests.test_qarm_exec
      - name: test_qarm_vqe (Q-ARM v2 VQE; Qiskit parts in the job below)
        run: python -m tests.test_qarm_vqe
      - name: test_libqarm (the native runtime; its ibm backend against a mock of IBM's API in the job below)
        run: python -m tests.test_libqarm
      - name: libqarm with CMake
        shell: bash
        run: |
          cmake -S runtime/libqarm -B build/libqarm
          cmake --build build/libqarm --config Release
  export:
    # the exported circuits in Qiskit and in CUDA-Q itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross libcurl4-openssl-dev
      - name: Python packages
        run: python -m pip install unicorn lief capstone numpy qiskit qiskit-qasm3-import qiskit-aer qiskit-ibm-runtime cudaq "qoracle @ git+https://github.com/quantag/qoracle.git"
      - name: test_qcpu_export
        run: python -m tests.test_qcpu_export
      - name: test_qcpu_run
        run: python -m tests.test_qcpu_run
      - name: test_qarm_exec on QPU backends
        run: python -m tests.test_qarm_exec
      - name: test_qarm_vqe on QPU backends
        run: python -m tests.test_qarm_vqe
      - name: test_libqarm with the mock of IBM's REST API
        run: python -m tests.test_libqarm
